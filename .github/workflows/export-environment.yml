name: Export environment
# Installs the pinned export environment (constraints/export.txt) from scratch, exports
# omniASR_CTC_300M_v2 with export_onnx.py, and checks the provenance it records: the
# fairseq2 vs ONNX Runtime parity on a FLEURS clip, the pinned versions, and the hashes of
# the files written. Downloads the ~1.3 GB upstream checkpoint, so it runs weekly, on
# demand, and on PRs that change the export path or its pins.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"
  pull_request:
    paths:
      - .github/workflows/export-environment.yml
      - constraints/export.txt
      - export_onnx.py
      - tools/provenance.py
      - tools/onnx_fold.py
      - tools/stamp_tokenizer.py
      - tools/publish_hub.py

permissions:
  contents: read

concurrency:
  group: export-environment-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space for the checkpoint and export
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: System libraries (libsndfile for fairseq2n; a compiler for kenlm)
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 build-essential cmake
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned export environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -c constraints/export.txt -e ".[onnx]" \
            torch torchaudio fairseq2 omnilingual-asr onnx
          python -m pip freeze
      - name: Every pinned export package is installed at its pinned version
        run: |
          python - <<'PY'
          from importlib import metadata
          from pathlib import Path
          pins = {}
          for line in Path("constraints/export.txt").read_text().splitlines():
              line = line.split("#", 1)[0].strip()
              if line:
                  name, version = line.split("==")
                  pins[name] = version
          for name in ["omnilingual-asr", "fairseq2", "fairseq2n", "torch", "torchaudio",
                       "onnx", "onnxruntime", "numpy", "sentencepiece", "protobuf"]:
              installed = metadata.version(name).split("+")[0]
              assert installed == pins[name], (name, installed, pins[name])
              print(name, installed)
          PY
      - name: Export omniASR_CTC_300M_v2
        run: |
          python export_onnx.py --model omniASR_CTC_300M_v2 --output export/model.onnx \
            --validation-audio tests/fixtures/fleurs/en_us_10233995782544396174.flac
      - name: Check the recorded provenance
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          out = Path("export")
          record = json.loads((out / "provenance.json").read_text())
          print(json.dumps(record, indent=2))
          packages = record["environment"]["packages"]
          assert packages["omnilingual-asr"]["version"] == "0.2.0"
          assert packages["fairseq2"]["version"] == "0.6"
          assert packages["torch"]["version"].startswith("2.8.0")
          assert record["exporter"]["git_commit"]
          assert record["source"]["model_card"] == "omniASR_CTC_300M_v2"
          assert len(record["source"]["weights_sha256"]) == 64
          assert record["tokenizer"]["sha256"] == hashlib.sha256(
              (out / "tokenizer.model").read_bytes()).hexdigest()
          for name, entry in record["files"].items():
              assert hashlib.sha256((out / name).read_bytes()).hexdigest() == entry["sha256"]
          validation = record["validation"]
          assert validation["input"]["source"] == "file"
          assert validation["argmax_agreement"] == 1.0, validation
          # 0.0021 measured locally with the same pins; allow for a different CPU.
          assert validation["max_abs_error"] < 1e-2, validation
          PY
      - name: The export loads and transcribes with the runtime
        run: |
          python - <<'PY'
          from fast_omniasr import OmniASR
          model = OmniASR("export/model.onnx", "export/tokenizer.model")
          text = model.transcribe("tests/fixtures/fleurs/en_us_10233995782544396174.flac").text
          print(text)
          assert text.strip()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: export-provenance
          path: export/provenance.json
